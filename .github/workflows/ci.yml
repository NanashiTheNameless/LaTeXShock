name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs per ref: a queued run waits for the one ahead of it instead of
# starting alongside it, so the rolling release is always published in commit
# order. cancel-in-progress stays false - cancelling would let a later commit's
# release overtake an earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current LTS and the latest release, resolved at run time so the
        # matrix tracks "LTS + latest" without needing version bumps.
        node-version: [lts/*, latest]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack and prepare Yarn
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile
        run: yarn compile

      - name: Test
        run: yarn test

  # Build the installable .vsix on every run so it can be downloaded from any
  # PR and is ready for the nightly release on main.
  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Enable Corepack and prepare Yarn
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Package extension (.vsix)
        run: yarn dlx @vscode/vsce package --no-yarn --out latexshock.vsix
        # Default yarn lacks "yarn list --prod --json" so "--no-yarn" is used

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: latexshock-vsix
          path: latexshock.vsix
          if-no-files-found: error
          retention-days: 14

  # Publish the built .vsix to a single rolling "Nightly-Rolling" prerelease,
  # only for pushes to main.
  nightly-release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Guards the release against concurrent writes from any other ref's run.
    # Also non-cancelling, for the same ordering reason as the workflow group.
    concurrency:
      group: nightly-rolling
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: latexshock-vsix

      - name: Ensure Nightly-Rolling release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view Nightly-Rolling >/dev/null 2>&1; then
            gh release create Nightly-Rolling \
              --latest \
              --title "Nightly (Rolling)" \
              --notes "Rolling nightly build of the LaTeXShock extension, updated automatically from main. Download the latest .vsix asset below and install it with the \"Extensions: Install from VSIX...\" command." \
              --target "$GITHUB_SHA"
          fi
          # Enforce non-prerelease + latest even if the release pre-existed
          # (e.g. was created as a prerelease by an earlier run).
          gh release edit Nightly-Rolling --latest --prerelease=false
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/Nightly-Rolling" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "upload_url=https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets{?name,label}" >> "$GITHUB_OUTPUT"

      - name: Publish VSIX to Nightly-Rolling
        uses: NanashiTheNameless/deploy-nightly@master
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          release_id: ${{ steps.release.outputs.id }}
          asset_path: ./latexshock.vsix
          asset_name: latexshock-$$.vsix
          asset_content_type: application/octet-stream
          max_releases: 4
          token: ${{ github.token }}

      # A stable filename that always holds the newest build, so the download
      # URL never changes. Uploaded *after* deploy-nightly, which prunes old
      # timestamped assets - running last means this is restored every time
      # even if that pruning ever catches it.
      - name: Publish rolling latexshock-latest.vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp latexshock.vsix latexshock-latest.vsix
          gh release upload Nightly-Rolling latexshock-latest.vsix --clobber

  # Publish a tagged release to Open VSX. Runs only for version tags (v*), so a
  # given version is published exactly once - Open VSX rejects re-publishing an
  # existing version. Bump package.json, tag vX.Y.Z, push the tag.
  openvsx-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: latexshock-vsix

      # A vX.Y.Z tag that doesn't match the packaged version would publish the
      # wrong build under the tag's name. Fail loudly instead.
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing version $pkg"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish latexshock.vsix -p "$OVSX_PAT"
